<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pizzaria Toscana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <img src="toscana.png" alt="Logo da Pizzaria">
        <h1>🍕 Monte seu pedido</h1>
        <form action="pedido.php" method="POST">
            <h3>1. Tamanho:</h3>
            <label><input type="radio" name="tamanho" value="Broto"> Broto (R$ 45)</label>
            <label><input type="radio" name="tamanho" value="Grande"> Grande (R$ 65)</label>

            <h3>2. Sabores (1 ou 2):</h3>
            <label><input type="checkbox" name="sabores[]" value="Calabresa"> Calabresa</label>
            <label><input type="checkbox" name="sabores[]" value="Mussarela"> Mussarela</label>
            <label><input type="checkbox" name="sabores[]" value="Frango"> Frango</label>
            <label><input type="checkbox" name="sabores[]" value="Strogonof"> Strogonof</label>
            <label><input type="checkbox" name="sabores[]" value="Lombo"> Lombo</label>

            <h3>3. Borda:</h3>
            <label><input type="radio" name="borda" value="Nenhum"> Nenhum (R$ 0)</label>
            <label><input type="radio" name="borda" value="Catupiry"> Catupiry (R$ 5)</label>
            <label><input type="radio" name="borda" value="Cheddar"> Cheddar (R$ 5)</label>
        

            <h3>4. Refrigerante:</h3>
            <select name="refri">
                <option value="Nenhum">Nenhum</option>
                <option value="Coca">Coca 2L (R$ 12)</option>
                <option value="Guarana">Guaraná 2L (R$ 10)</option>
                <option value="H2O">H20 500ML (R$ 7)</option>
                <option value="Fanta uva">Fanta uva 1L (R$ 10)</option>
            </select>

            <h3>5. Cupom de Desconto:</h3>
            <input type="text" name="cupom">

            <button type="submit">Calcular Total</button>
        </form>
    </div>
</body>
</html>
